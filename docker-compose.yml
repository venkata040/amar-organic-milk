services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amar-milk-backend
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amar-milk-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped